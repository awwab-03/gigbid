[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:redis]
command=redis-server --port 6379 --save "" --appendonly no
priority=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:gigsim]
command=uvicorn gigsim.app:app --host 127.0.0.1 --port 8081
environment=GIGSIM_DB="/app/state/gigsim.sqlite"
priority=5
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:mcp-portfolio]
command=python -m mcp_servers.portfolio.server
environment=MCP_HOST="127.0.0.1"
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:mcp-marketplace]
command=python -m mcp_servers.marketplace.server
environment=MCP_HOST="127.0.0.1"
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:mcp-workspace]
command=python -m mcp_servers.workspace.server
environment=MCP_HOST="127.0.0.1"
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
command=uvicorn apps.api.main:app --host 127.0.0.1 --port 8000
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
command=arq worker.main.WorkerSettings
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:caddy]
command=caddy run --config /etc/caddy/Caddyfile
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

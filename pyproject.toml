[project]
name = "gigbid"
version = "0.2.0"
description = "GigBid: a multi-agent freelancer copilot (AI-4016 R&D assignment)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "pydantic==2.11.4",
  "pydantic-settings==2.9.1",
  "pyyaml==6.0.2",
  "httpx==0.28.1",
  "python-dotenv==1.1.0",
  "sse-starlette==2.3.5",
  "langgraph==0.4.8",
  "langgraph-checkpoint-postgres==2.0.21",
  "langgraph-supervisor==0.0.27",
  "langchain-core==0.3.63",
  "langchain-openai==0.3.18",
  "langchain-ollama==0.3.3",
  "langchain-mcp-adapters==0.1.7",
  "langsmith==0.3.43",
  "mcp==1.12.4",
  "psycopg[binary,pool]==3.2.9",
  "pgvector==0.4.1",
  "redis==5.2.1",
  "arq==0.26.3",
  "rank-bm25==0.2.2",
  "numpy==1.26.4",
  "scipy==1.15.3",
  "fastembed==0.7.0",
  "pypdf==5.5.0",
  "reportlab==4.4.1",
  "cryptography==45.0.3",
  "pyjwt==2.10.1",
  "bcrypt==4.3.0",
  "tenacity==9.1.2",
  "pandas==2.2.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "pytest-asyncio==0.26.0",
  "ruff==0.11.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "apps*", "rag*", "mcp_servers*", "worker*", "gigsim*", "evals*"]

[tool.ruff]
line-length = 100
extend-exclude = ["apps/web", "gigsim/data", "data/personas", "data/raw"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "mcp_servers"]

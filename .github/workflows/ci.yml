name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    env:
      MODEL_PROFILE: fake
      GIGBID_TIMEOUT_SCALE: "5"  # first V8 call on a CI CPU also downloads the cross-encoder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - uses: actions/cache@v4
        # models live in data/processed/models (rag/index/models.py); ~ is not expanded in env values
        with: {path: data/processed/models, key: fastembed-models-v2}
      - run: pip install uv==0.7.8 && uv pip install --system -e ".[dev]"
      - name: Repository rules (secrets, gigsim frozen, prompts in agent/prompts)
        run: python scripts/ci_checks.py
      - run: ruff check .
      - name: Unit, contract (MCP schema snapshots) and integration tests
        run: pytest -q

  web:
    runs-on: ubuntu-24.04
    env:
      MODEL_PROFILE: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: pip install uv==0.7.8 && uv pip install --system -e .
      - run: npm ci --prefix apps/web
      - name: Generated API client is up to date
        run: |
          python scripts/export_openapi.py
          npx --prefix apps/web openapi-typescript apps/web/openapi.json -o apps/web/src/lib/api/schema.d.ts
          git diff --exit-code apps/web/src/lib/api/schema.d.ts
      - run: npm run build --prefix apps/web
      - run: npx --prefix apps/web playwright install --with-deps chromium
      - name: Playwright end-to-end tests
        run: npm run e2e --prefix apps/web
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: playwright-report, path: apps/web/playwright-report}

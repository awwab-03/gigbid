name: Keep live URL awake
# Free Hugging Face Spaces sleep after 48 h without traffic; the hidden test run happens after the
# deadline, so ping the app every 6 hours. Needs repository variable LIVE_URL.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    if: ${{ vars.LIVE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "${{ vars.LIVE_URL }}/api/health") && echo "health: $code"
            [ "$code" = "200" ] && exit 0
            sleep 60
          done
          exit 1

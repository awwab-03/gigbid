# GigBid configuration. Every model, budget, threshold, tool allowlist and platform rule lives
# here or in agent/prompts/ / data/policy_pack/ - never in code.

marketplace:
  mode: gigsim                    # gigsim | upwork_live   (env MARKETPLACE_MODE overrides)
  gigsim_requests_per_minute: 40  # stays under GigSim's 60/min limit
  live_requests_per_minute: 6     # conservative for the official Upwork MCP server (see RUNBOOK)
  live_scout_interval_minutes: 240
  gigsim_scout_interval_minutes: 30
  # Upwork MCP tool names -> GigBid marketplace operations. Verify against list_tools after OAuth.
  live_tool_map:
    search_jobs: search_jobs
    get_job: get_job_details
    get_client_history: get_client_info
    get_connects_balance: get_connects
    list_threads: list_rooms
    list_messages: list_messages
    list_proposals: list_proposals
    create_proposal_draft: create_proposal_draft
    send_message_draft: create_message_draft

policy:
  pack: data/policy_pack/marketplace_policy.md
  rules_file: data/policy_pack/rules.yaml
  # Platform policy version GigBid expects; a mismatch with GET /policy raises a UI warning.
  expected_version: v1

models:
  profile: open                   # open | paid   (env MODEL_PROFILE overrides)
  profiles:
    open:
      provider: openai_compatible # Cerebras (free tier) here; Groq / OpenRouter / vLLM work the same way
      base_url_env: OPEN_LLM_BASE_URL
      api_key_env: OPEN_LLM_API_KEY
      nodes:
        scout: small
        analyst: small
        risk_assessor: small
        fit_matcher: small
        pricing: small
        writer: large
        verifier: small
        critic: large
        compliance: small
        client_liaison: large
        intent: small
        judge: large
      aliases:
        small: qwen-3.8-27b
        large: gpt-oss-120b
      fallback:
        small: gpt-oss-120b
        large: qwen-3.8-27b
      # Cerebras free tier: USD 0 per token. Tokens are still counted per node; the report gives both.
      pricing_usd_per_mtok:
        qwen-3.8-27b: {in: 0.0, out: 0.0}
        gpt-oss-120b: {in: 0.0, out: 0.0}
    open_single:                    # second open configuration for the model comparison: one model everywhere
      provider: openai_compatible
      base_url_env: OPEN_LLM_BASE_URL
      api_key_env: OPEN_LLM_API_KEY
      nodes: {default: large}
      aliases: {small: gpt-oss-120b, large: gpt-oss-120b}
      fallback: {small: qwen-3.8-27b, large: qwen-3.8-27b}
      pricing_usd_per_mtok: {gpt-oss-120b: {in: 0.0, out: 0.0}, qwen-3.8-27b: {in: 0.0, out: 0.0}}
    gemma:                          # open-weights Gemma 4 on Google AI Studio's free tier (OpenAI-compatible endpoint), from 12 Nov 2026
      provider: openai_compatible   # after the Cerebras promotional credit ($5) ran out
      base_url_env: OPEN_LLM_BASE_URL
      api_key_env: OPEN_LLM_API_KEY
      nodes: {analyst: small, risk_assessor: small, fit_matcher: small, pricing: small, verifier: small, compliance: small,
              intent: small, scout: small, writer: large, critic: large, client_liaison: large, judge: large}
      aliases: {small: gemma-4-26b-a4b-it, large: gemma-4-31b-it}
      fallback: {small: gemma-4-31b-it, large: gemma-4-26b-a4b-it}
      pricing_usd_per_mtok: {gemma-4-26b-a4b-it: {in: 0.0, out: 0.0}, gemma-4-31b-it: {in: 0.0, out: 0.0}}  # free tier, no billing account
    open_qwen:                      # every node on qwen-3.8-27b (450 req/min free tier); used for the proposal-level experiments
      provider: openai_compatible   # because gpt-oss-120b's free tier allows only 5 req/min, 150 req/h, 1M tokens/day
      base_url_env: OPEN_LLM_BASE_URL
      api_key_env: OPEN_LLM_API_KEY
      nodes: {default: large}
      aliases: {small: qwen-3.8-27b, large: qwen-3.8-27b}
      fallback: {small: qwen-3.8-27b, large: qwen-3.8-27b}
      pricing_usd_per_mtok: {qwen-3.8-27b: {in: 0.0, out: 0.0}}
    local:
      provider: ollama
      base_url_env: OLLAMA_BASE_URL
      nodes: {default: small}
      aliases: {small: "llama3.1:8b", large: "llama3.1:8b"}
      fallback: {small: "llama3.1:8b", large: "llama3.1:8b"}
      pricing_usd_per_mtok: {}
    fake:                          # deterministic stand-in for CI / Playwright; never used for reported numbers
      provider: fake
      nodes: {default: small}
      aliases: {small: fake, large: fake}
      fallback: {small: fake, large: fake}
      pricing_usd_per_mtok: {}
    paid:
      provider: openai_compatible
      base_url_env: PAID_LLM_BASE_URL
      api_key_env: PAID_LLM_API_KEY
      nodes: {default: large}
      aliases: {small: "gpt-4.1-mini", large: "gpt-4.1"}
      fallback: {small: "gpt-4.1-mini", large: "gpt-4.1-mini"}
      pricing_usd_per_mtok:
        gpt-4.1-mini: {in: 0.40, out: 1.60}
        gpt-4.1: {in: 2.00, out: 8.00}
  temperature: {default: 0.2, writer: 0.6}
  timeout_s: 45
  max_retries: 2

embeddings:
  model: BAAI/bge-small-en-v1.5   # open, CPU (fastembed)
reranker:
  model: Xenova/ms-marco-MiniLM-L-6-v2   # open cross-encoder, CPU (fastembed)

rag:
  variant: v8_crag                 # best on the full dev set (evals/results/rag_variants.json); see docs/adr/0004
  k: 8
  chunk_size: 700
  chunk_overlap: 100
  outcome_boost: {won: 0.15, replied: 0.08, ignored: -0.05}
  # cross-encoder logit above which a requirement counts as supported; calibrated on the dev set
  # (Youden J) by evals/runners/calibrate_support.py -> evals/results/support_threshold.json
  crag_good_logit: -7.9
  crag_max_attempts: 2

budgets:
  max_graph_steps: 40
  max_revisions: 2
  max_tokens_per_job: 60000
  declared_p95_latency_s: {job_analysed: 25, proposal: 90}
  declared_cost_usd: {job_analysed: 0.004, proposal: 0.02}

thresholds:
  minimum_fit_score: 0.70          # 0.60 -> 0.70 chosen on the dev set (failure analysis: over-generous evidence at fit 0.67); see report section 8
  watch_fit_score: 0.45
  maximum_risk_score: 0.60
  minimum_client_quality: 0.30
  claim_support_min: 0.55          # verifier similarity needed for "supported"
  critic_pass_score: 7             # out of 10

risk_llm_band: [0.35, 0.6]     # ask the small model only when deterministic risk is ambiguous

autonomy:
  default_level: suggest           # suggest | auto_skip  (never auto_send)

# Per-agent MCP tool allowlists (A6). The client filters tools by these names.
tool_allowlist:
  scout: [marketplace.search_jobs, marketplace.get_job]
  analyst: []
  risk_assessor: [marketplace.get_client_history]
  fit_matcher: [portfolio.match_requirements, portfolio.search_evidence, portfolio.get_case_study, portfolio.list_skills]
  pricing: [marketplace.get_pricing_stats, marketplace.get_client_history, marketplace.get_connects_balance, marketplace.get_policy]
  writer: [portfolio.search_evidence, portfolio.get_case_study]
  verifier: [portfolio.verify_claims, portfolio.search_evidence]
  critic: [portfolio.get_case_study]
  compliance: [marketplace.get_policy]
  client_liaison: [marketplace.list_threads, marketplace.list_messages, marketplace.send_message, workspace.free_slots,
                   workspace.create_interview_hold, workspace.create_email_draft]
  submitter: [marketplace.create_proposal_draft, marketplace.submit_proposal]
  pipeline: [marketplace.list_proposals, marketplace.get_events, marketplace.list_threads, marketplace.list_messages, marketplace.get_job]
  ui: [marketplace.search_jobs, marketplace.get_job, marketplace.get_client_history, marketplace.list_threads, marketplace.list_messages,
       marketplace.list_proposals, marketplace.get_events, marketplace.get_connects_balance, marketplace.get_policy,
       portfolio.get_case_study, portfolio.search_evidence, portfolio.list_skills]
  # R&D C baselines (evals/runners/agent_comparison.py): read-only, no submit/send tools
  rnd_c: [marketplace.get_job, marketplace.get_client_history, marketplace.get_pricing_stats, marketplace.get_policy,
          portfolio.search_evidence, portfolio.match_requirements, portfolio.verify_claims, portfolio.get_case_study]

mcp:
  timeout_s: 20
  max_retries: 2
  servers:
    portfolio: {url_env: PORTFOLIO_MCP_URL, default: "http://localhost:8091/mcp"}
    marketplace: {url_env: MARKETPLACE_MCP_URL, default: "http://localhost:8092/mcp"}
    workspace: {url_env: WORKSPACE_MCP_URL, default: "http://localhost:8093/mcp"}
    github: {url_env: GITHUB_MCP_URL, default: "https://api.githubcopilot.com/mcp/", token_env: GITHUB_MCP_TOKEN}
